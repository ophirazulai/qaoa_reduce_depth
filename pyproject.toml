[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qaqa-reduce-depth"
version = "0.1.0"
description = "Find minimum two-qubit-depth transpilation across seeds and SABRE weights"
requires-python = ">=3.12"
dependencies = [
  "qiskit @ git+https://github.com/AI-native-Systems-Research/qiskit-evolved.git@9dedcf6f64a66344cb31364e846f71d020adcf9d",
  "qiskit-ibm-runtime==0.52.1",
  "sympy==1.14.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[project.scripts]
qaqa-reduce-depth = "qaqa_reduce_depth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
